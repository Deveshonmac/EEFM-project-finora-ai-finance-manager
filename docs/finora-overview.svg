<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Finora personal finance dashboard</title>
  <desc id="description">An illustration of a personal finance dashboard with balance, budget, savings, and spending cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
